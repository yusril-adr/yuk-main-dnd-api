---
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${MAIN_DB_USERNAME:-root123}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:-requestor}
      POSTGRES_DB: ${MAIN_DB_DATABASE:-requestor}
    ports:
      - &db_port "${MAIN_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAIN_DB_USERNAME:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: {}
